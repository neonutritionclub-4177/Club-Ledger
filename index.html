function renderAttendance() {
  const customers = activeCustomers();
  const date = state.attendanceDate;
  const isToday = date === todayStr();
  const count = customers.filter(c => (c.visits || []).includes(date)).length;
  const shakesServed = customers.reduce((sum, c) => sum + attendanceCount(c, date), 0);

  const last7 = Array.from({ length: 7 }, (_, i) => addDays(todayStr(), -6 + i));
  const counts = last7.map(d => customers.filter(c => (c.visits || []).includes(d)).length);
  const maxCount = Math.max(1, ...counts);

  const barsHtml = last7.map((d, i) => `
    <div class="bar-col">
      <div class="bar-track"><div class="bar-fill" style="height:${(counts[i] / maxCount * 56)}px"></div></div>
      <span class="bar-day">${formatDateShort(d).split(' ')[0]}</span>
    </div>
  `).join('');

  let listHtml;
  if (customers.length === 0) {
    listHtml = `<div class="empty-state"><p class="title">No customers yet</p><p class="subtitle">Add customers from the Customers tab to start marking attendance.</p></div>`;
  } else {
    listHtml = `<div class="attendance-list">${customers.map(c => {
      const present = attendanceCount(c, date) > 0;
      const idx = currentPackIndex(c);
      const remaining = packShakesRemaining(c, idx);
      const totalShakes = idx >= 0 ? c.packs[idx].totalShakes : 0;
      return `
        <div class="attendance-item">
          <span class="name-block">
            <span class="name">${escapeHtml(c.name)}</span>
            <span class="shakes-line">${packStatus(c, idx) === 'expired' ? 'Pack expired' : (remaining === 0 ? 'Pack finished' : remaining + '/' + totalShakes + ' shakes left')} · served ${attendanceCount(c, date)}</span>
          </span>
          <span class="attendance-controls">
            <button type="button" aria-label="Remove one shake" data-action="adjustAttendance" data-delta="-1" data-id="${c.id}" ${present ? '' : 'disabled'}>−</button>
            <span class="check-circle ${present ? 'checked' : ''}">${present ? attendanceCount(c, date) : ''}</span>
            <button type="button" aria-label="Add one shake" data-action="adjustAttendance" data-delta="1" data-id="${c.id}">+</button>
          </span>
        </div>
      `;
    }).join('')}</div>`;
  }

  return `
    <div class="card">
      <div class="date-nav">
        <button data-action="navDate" data-delta="-1">${ICONS.arrowLeft}</button>
        <div class="date-label">
          <p class="big">${isToday ? 'Today' : formatDateShort(date)}</p>
          <p class="small">${formatDateLong(date)}</p>
        </div>
        <button data-action="navDate" data-delta="1" ${date >= todayStr() ? 'disabled' : ''}>${ICONS.arrowRight}</button>

      <p class="payments-title">Last 7 days footfall</p>
      <div class="bar-chart">${barsHtml}</div>
    </div>
    ${listHtml}
  `;
}

/* ---------- Reports (monthly) ---------- */
function computeMonthlyStats(monthStr) {
  const customers = activeCustomers();
  let revenue = 0, visits = 0, newPacks = 0;
  const activeIds = new Set();
  const perCustomer = [];
  customers.forEach(c => {
    const visitsInMonth = (c.visits || []).filter(d => d.startsWith(monthStr)).length;
    const paidInMonth = (c.payments || []).filter(p => !p.deleted && p.date.startsWith(monthStr)).reduce((s, p) => s + Number(p.amount || 0), 0);
    const packsStarted = (c.packs || []).filter(p => p.startDate.startsWith(monthStr)).length;
    revenue += paidInMonth;
    visits += visitsInMonth;
    newPacks += packsStarted;
    if (visitsInMonth > 0) activeIds.add(c.id);
    if (visitsInMonth > 0 || paidInMonth > 0) {
      perCustomer.push({ name: c.name, visits: visitsInMonth, paid: paidInMonth });
    }
  });
  perCustomer.sort((a, b) => b.paid - a.paid || b.visits - a.visits);
  return { revenue, visits, newPacks, activeCustomers: activeIds.size, perCustomer };
}

function computeMonthlyOrderStats(monthStr) {
  const orders = activeOrders();
  let revenue = 0, newOrders = 0;
  const perCustomerMap = {};
  orders.forEach(o => {
    const paidInMonth = (o.payments || []).filter(p => !p.deleted && p.date.startsWith(monthStr)).reduce((s, p) => s + Number(p.amount || 0), 0);
    revenue += paidInMonth;
    if ((o.date || '').startsWith(monthStr)) newOrders++;
    if (paidInMonth > 0) {
      perCustomerMap[o.customerName] = (perCustomerMap[o.customerName] || 0) + paidInMonth;
    }
  });
  const perCustomer = Object.entries(perCustomerMap)
    .map(([name, paid]) => ({ name, paid }))
    .sort((a, b) => b.paid - a.paid);
  return { revenue, newOrders, perCustomer };
}

/* ---------- Reports: daily / monthly / customers & renewals ---------- */
function shortINR(n) {
  n = Math.round(Number(n) || 0);
  if (n >= 100000) return (n / 100000).toFixed(n % 100000 ? 1 : 0) + 'L';
  if (n >= 1000) return (n / 1000).toFixed(n % 1000 ? 1 : 0) + 'k';
  return String(n);
}
function daysInMonth(monthStr) {
  const [y, m] = monthStr.split('-').map(Number);
  return new Date(Date.UTC(y, m, 0)).getUTCDate();
}
function pctDelta(cur, prev) { return prev > 0 ? Math.round(((cur - prev) / prev) * 100) : null; }
function deltaTag(d) { return d === null ? '' : `<span class="delta">${d >= 0 ? '▲' : '▼'} ${Math.abs(d)}% vs last month</span>`; }

function dayData(d) {
  const club = [], orders = [], packs = [];
  activeCustomers().forEach(c => {
    (c.payments || []).filter(p => !p.deleted).forEach(p => { if (p.date === d) club.push({ name: c.name, amount: Number(p.amount) || 0, note: p.note || '', ts: p.ts || 0 }); });
    (c.packs || []).forEach((pk, i) => { if (pk.startDate === d) packs.push({ name: c.name, shakes: pk.totalShakes, cost: Number(pk.cost) || 0, renewal: i > 0 }); });
  });
  activeOrders().forEach(o => (o.payments || []).filter(p => !p.deleted).forEach(p => {
    if (p.date === d) orders.push({ name: o.customerName, amount: Number(p.amount) || 0, note: p.note || '', ts: p.ts || 0 });
  }));
  const visits = activeCustomers().filter(c => (c.visits || []).includes(d)).length;
  const clubTotal = club.reduce((s, x) => s + x.amount, 0);
  const orderTotalAmt = orders.reduce((s, x) => s + x.amount, 0);
  return { club, orders, packs, visits, clubTotal, orderTotal: orderTotalAmt, total: clubTotal + orderTotalAmt };
}

function monthRevenueTotal(monthStr) { return computeMonthlyStats(monthStr).revenue + computeMonthlyOrderStats(monthStr).revenue; }

function valueBars(labels, values, highlightIdx) {
  const max = Math.max(1, ...values);
  return `<div class="vbars">${labels.map((l, i) => `
    <div class="vbar-col">
      <span class="vbar-val">${values[i] > 0 ? shortINR(values[i]) : ''}</span>
      <div class="vbar-track"><div class="vbar-fill ${i === highlightIdx ? 'cur' : ''}" style="height:${(values[i] / max * 72)}px"></div></div>
      <span class="vbar-day">${l}</span>
    </div>`).join('')}</div>`;
}

function renderReports() {
  if (activeCustomers().length === 0 && activeOrders().length === 0) {
    return `<div class="empty-state"><p class="title">No data yet</p><p class="subtitle">Add customers, mark attendance, or record orders to see reports.</p></div>`;
  }
  const views = [['daily', 'Daily'], ['monthly', 'Monthly'], ['customers', 'Customers']];
  const seg = `<div class="rseg">${views.map(([v, l]) => `<button class="${state.reportView === v ? 'active' : ''}" data-action="setReportView" data-value="${v}">${l}</button>`).join('')}</div>`;
  let body;
  if (state.reportView === 'monthly') body = renderMonthlyReport();
  else if (state.reportView === 'customers') body = renderCustomersReport();
  else body = renderDailyReport();
  return seg + body;
}

}

function renderMonthlyReport() {
  const month = state.reportMonth;
  const stats = computeMonthlyStats(month);
  const orderStats = computeMonthlyOrderStats(month);
  const currentMonth = todayStr().slice(0, 7);
  const total = stats.revenue + orderStats.revenue;
  const prevTotal = monthRevenueTotal(addMonths(month, -1));
  const delta = pctDelta(total, prevTotal);

  // per-day revenue within the month -> best day + average per day
  const dim = daysInMonth(month);
  let best = { day: null, amt: 0 };
  for (let i = 1; i <= dim; i++) {
    const ds = month + '-' + String(i).padStart(2, '0');
    if (ds > todayStr()) break;
    const t = dayData(ds).total;
    if (t > best.amt) best = { day: ds, amt: t };
  }
  const elapsed = month === currentMonth ? Number(todayStr().slice(8)) : dim;
  const avg = elapsed > 0 ? total / elapsed : 0;

  const last6 = Array.from({ length: 6 }, (_, i) => addMonths(currentMonth, -5 + i));
  const sixTotals = last6.map(monthRevenueTotal);
  const orderRevs = last6.map(m => computeMonthlyOrderStats(m).revenue);

  const tableHtml = stats.perCustomer.length === 0
    ? `<p class="empty-state-text">No visits or payments recorded in ${formatMonthLong(month)}.</p>`
    : stats.perCustomer.map(r => `
        <div class="report-row">
          <div><p class="name">${escapeHtml(r.name)}</p><p class="meta">${r.visits} visit${r.visits === 1 ? '' : 's'}</p></div>
          <p class="amt">${formatCurrency(r.paid)}</p>
        </div>`).join('');
  const orderTableHtml = orderStats.perCustomer.length === 0
    ? `<p class="empty-state-text">No order payments recorded in ${formatMonthLong(month)}.</p>`
    : orderStats.perCustomer.map(r => `
        <div class="report-row"><p class="name">${escapeHtml(r.name)}</p><p class="amt">${formatCurrency(r.paid)}</p></div>`).join('');

  return `
    <div class="card">
      <div class="date-nav">
        <button data-action="navMonth" data-delta="-1">${ICONS.arrowLeft}</button>
        <div class="date-label"><p class="big">${formatMonthLong(month)}</p></div>
        <button data-action="navMonth" data-delta="1" ${month >= currentMonth ? 'disabled' : ''}>${ICONS.arrowRight}</button>
      </div>
    </div>
    <div class="hero-stat">
      <p class="big">${formatCurrency(total)}${deltaTag(delta)}</p>
      <p class="cap">Total revenue collected</p>
      <div class="split">
        <span><b>${formatCurrency(stats.revenue)}</b>Packs</span>
        <span><b>${formatCurrency(orderStats.revenue)}</b>Orders</span>
        <span><b>${formatCurrency(avg)}</b>Avg / day</span>
        <span><b>${best.day ? formatCurrency(best.amt) : '—'}</b>${best.day ? 'Best: ' + formatDateShort(best.day) : 'Best day'}</span>
      </div>
    </div>
    <div class="card">
      <p class="payments-title">Last 6 months — total revenue</p>
      ${valueBars(last6.map(formatMonthShort), sixTotals, last6.indexOf(month))}
    </div>

    <h3 class="section-title standalone">Club — packs &amp; shakes</h3>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon green">${ICONS.wallet}</div><div class="stat-value">${formatCurrency(stats.revenue)}</div><div class="stat-label">Revenue collected</div></div>
      <div class="stat-card"><div class="stat-icon blue">${ICONS.calendar}</div><div class="stat-value">${stats.visits}</div><div class="stat-label">Total visits</div></div>
      <div class="stat-card"><div class="stat-icon blue">${ICONS.users}</div><div class="stat-value">${stats.activeCustomers}</div><div class="stat-label">Active customers</div></div>
      <div class="stat-card"><div class="stat-icon green">${ICONS.trending}</div><div class="stat-value">${stats.newPacks}</div><div class="stat-label">Packs started</div></div>
    </div>
    <div class="card">
      <h3 class="section-title">By customer — ${formatMonthLong(month)}</h3>
      ${tableHtml}
    </div>

    <h3 class="section-title standalone">Orders — retail / wholesale</h3>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon green">${ICONS.wallet}</div><div class="stat-value">${formatCurrency(orderStats.revenue)}</div><div class="stat-label">Collected this month</div></div>
      <div class="stat-card"><div class="stat-icon blue">${ICONS.bag}</div><div class="stat-value">${orderStats.newOrders}</div><div class="stat-label">Orders placed</div></div>
    </div>
    <div class="card">
      <p class="payments-title">Last 6 months — orders revenue</p>
      ${valueBars(last6.map(formatMonthShort), orderRevs, last6.indexOf(month))}
    </div>
    <div class="card">
      <h3 class="section-title">By customer — orders, ${formatMonthLong(month)}</h3>
      ${orderTableHtml}
    </div>
  `;
}

function periodRange(period) {
  const today = todayStr();
  if (period === 'all') return { from: '0000-00-00', to: '9999-99-99', label: 'All time' };
  if (period === '90d') return { from: addDays(today, -89), to: today, label: 'Last 90 days' };
  return { from: today.slice(0, 8) + '01', to: today, label: formatMonthLong(today.slice(0, 7)) };
}
const inRange = (d, r) => d >= r.from && d <= r.to;

function rankList(items, fmtMeta) {
  if (items.length === 0) return `<p class="empty-state-text">Nothing in this period.</p>`;
  const max = Math.max(1, ...items.map(i => i.value));
  return items.map((it, i) => `
    <div class="rank-row">
      <span class="rank-no">${i + 1}</span>
      <div class="rank-main">
        <p class="name">${escapeHtml(it.name)}</p>
        <p class="meta">${fmtMeta(it)}</p>
        <div class="rank-bar"><i style="width:${Math.round(it.value / max * 100)}%"></i></div>
      </div>
      <p class="rank-amt">${it.label}</p>
    </div>`).join('');
}

function renderCustomersReport() {
  const r = periodRange(state.custPeriod);
  const periods = [['month', 'This month'], ['90d', '90 days'], ['all', 'All time']];

  const perCust = activeCustomers().map(c => ({
    name: c.name,
    paid: (c.payments || []).filter(p => !p.deleted && inRange(p.date, r)).reduce((s, p) => s + Number(p.amount || 0), 0),
    visits: (c.visits || []).filter(d => inRange(d, r)).length
  }));
  const topPaid = perCust.filter(x => x.paid > 0).sort((a, b) => b.paid - a.paid || b.visits - a.visits).slice(0, 10)
    .map(x => ({ name: x.name, value: x.paid, label: formatCurrency(x.paid), visits: x.visits }));
  const topVisits = perCust.filter(x => x.visits > 0).sort((a, b) => b.visits - a.visits || b.paid - a.paid).slice(0, 5)
    .map(x => ({ name: x.name, value: x.visits, label: x.visits + ' visits', paid: x.paid }));

  const buyers = {};
  activeOrders().forEach(o => (o.payments || []).filter(p => !p.deleted).forEach(p => {
    if (inRange(p.date, r)) buyers[o.customerName] = (buyers[o.customerName] || 0) + Number(p.amount || 0);
  }));
  const topBuyers = Object.entries(buyers).sort((a, b) => b[1] - a[1]).slice(0, 5)
    .map(([name, amt]) => ({ name, value: amt, label: formatCurrency(amt) }));

  // Pack renewals
  const renewed = [];
  let joins = 0;
  activeCustomers().forEach(c => (c.packs || []).forEach((pk, i) => {
    if (!inRange(pk.startDate, r)) return;
    if (i === 0) joins++;
    else renewed.push({ name: c.name, date: pk.startDate, shakes: pk.totalShakes, cost: Number(pk.cost) || 0 });
  }));
  renewed.sort((a, b) => a.date < b.date ? 1 : -1);
  const renewedValue = renewed.reduce((s, x) => s + x.cost, 0);

  const due = activeCustomers().filter(c => shakesRemaining(c) <= LOW_SHAKES)
    .sort((a, b) => shakesRemaining(a) - shakesRemaining(b));
  const dueValue = due.reduce((s, c) => { const idx = currentPackIndex(c); return s + (idx >= 0 ? Number(c.packs[idx].cost) || 0 : 0); }, 0);

  const dueHtml = due.length === 0
    ? `<p class="empty-state-text">Nobody is running low. Great.</p>`
    : due.map(c => {
        const rem = shakesRemaining(c);
        const sent = reminderSent(c, 'shakes');
        const idx = currentPackIndex(c);
        return `
        <div class="followup-item">
          <div><p class="followup-name">${escapeHtml(c.name)}</p><p class="followup-due">${rem === 0 ? 'Pack finished' : rem + ' shake' + (rem === 1 ? '' : 's') + ' left'} · last pack ${formatCurrency(idx >= 0 ? c.packs[idx].cost : 0)}</p></div>
          <div class="row-actions">
            <button class="btn-remind ${sent ? 'done' : ''}" data-action="remind" data-type="shakes" data-id="${c.id}">${sent ? 'Reminded ✓' : 'Remind'}</button>
            <button class="btn-pay-mini" data-action="openRenew" data-id="${c.id}">Renew</button>
          </div>
        </div>`;
      }).join('');

  const renewedHtml = renewed.length === 0
    ? `<p class="empty-state-text">No renewals in this period.</p>`
    : renewed.slice(0, 20).map(x => `
        <div class="report-row">
          <div><p class="name">${escapeHtml(x.name)}</p><p class="meta">${formatDateShort(x.date)} · ${x.shakes} shakes</p></div>
          <p class="amt">${formatCurrency(x.cost)}</p>
        </div>`).join('') + (renewed.length > 20 ? `<p class="empty-state-text" style="margin-top:8px">+ ${renewed.length - 20} more</p>` : '');

  return `
    <div class="chips">
      ${periods.map(([v, l]) => `<button class="chip ${state.custPeriod === v ? 'active' : ''}" data-action="setCustPeriod" data-value="${v}">${l}</button>`).join('')}
    </div>

    <div class="hero-stat">
      <p class="big">${due.length} renewal${due.length === 1 ? '' : 's'} due</p>
      <p class="cap">Customers with ${LOW_SHAKES} or fewer shakes left</p>
      <div class="split">
        <span><b>≈ ${formatCurrency(dueValue)}</b>Expected renewals</span>
        <span><b>${renewed.length}</b>Renewed (${r.label})</span>
        <span><b>${joins}</b>New joins</span>
      </div>
    </div>

    <div class="card">
      <h3 class="section-title">Renewals due now</h3>
      ${dueHtml}
    </div>
    <div class="card">
      <h3 class="section-title">Renewed — ${r.label} · ${formatCurrency(renewedValue)}</h3>
      ${renewedHtml}
    </div>
    <div class="card">
      <h3 class="section-title">Top customers by revenue — ${r.label}</h3>
      ${rankList(topPaid, it => it.visits + ' visit' + (it.visits === 1 ? '' : 's'))}
    </div>
    <div class="card">
      <h3 class="section-title">Most regular — ${r.label}</h3>
      ${rankList(topVisits, it => formatCurrency(it.paid) + ' paid')}
    </div>
    <div class="card">
      <h3 class="section-title">Top order buyers — ${r.label}</h3>
      ${rankList(topBuyers, () => 'Retail / wholesale')}
    </div>
  `;
}

/* ---------- Actions ---------- */
function setPath(obj, path, value) {
  const parts = path.split('.');
  let target = obj;
  for (let i = 0; i < parts.length - 1; i++) target = target[parts[i]];
  target[parts[parts.length - 1]] = value;
}

function handleAction(action, target) {
  const id = target.dataset.id;
  switch (action) {
    case 'dismissOwnerApproval':
      state.ownerApprovalNotice = false;
      render();
      break;
    case 'dismissDataNotice':
      state.dataNotice = '';
      render();
      break;
    case 'approveOwner': reviewOwnerRequest(id, 'approve'); break;
    case 'rejectOwner': reviewOwnerRequest(id, 'reject'); break;
    case 'refreshOwnerRequests': refreshAdminRequests(); break;
    case 'editOwnerRequest': openEditOwner(id); break;
    case 'archiveOwnerRequest': setOwnerRequestArchived(id, true); break;
    case 'restoreOwnerRequest': setOwnerRequestArchived(id, false); break;
    case 'revokeOwner': setOwnerAccess(id, false); break;
    case 'restoreOwnerAccess': setOwnerAccess(id, true); break;
    case 'toggleArchivedOwnerRequests':
      state.adminShowArchived = !state.adminShowArchived;
      refreshAdminRequests();
      break;
    case 'adminLogout':
      state.adminAuthenticated = false;
      state.adminRequests = [];
      state.adminForm.password = '';
      state.adminForm.error = '';
      supabaseClient.auth.signOut();
      break;
    case 'setTab':
      state.tab = target.dataset.value;
      state.expandedId = null;
      state.removePayment = null;
      render();
      break;
    case 'openAttendance':
      state.tab = 'attendance';
      state.attendanceDate = todayStr();
      render();
      break;
    case 'openQuickPayment': {
      const customers = activeCustomers();
      const firstDue = customers.find(c => balanceOf(c) > 0) || customers[0];
      state.modal = { type: 'quickPayment' };
      state.modalForm = { customerId: firstDue ? firstDue.id : '', amount: '', date: todayStr(), note: '' };
      render();
      break;
    }
    case 'toggleTheme':
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = state.theme;
      try { localStorage.setItem('clubLedgerTheme', state.theme); } catch (e) {}
      render();
      break;
    case 'toggleExpand':
      state.expandedId = state.expandedId === id ? null : id;
      state.removePayment = null;
      render();
      break;
    case 'setFilter':
      state.filter = target.dataset.value;
      render();
      break;
    case 'openAddCustomer':
      state.modal = { type: 'addCustomer' };
      state.modalForm = { name: '', phone: '', joinDate: todayStr(), packType: '26-day', totalShakes: String(packType('26-day').totalShakes), cost: '', remainingShakes: String(packType('26-day').totalShakes), initialPayment: '' };
      render();
      break;
    case 'openEditCustomer': {
      const c = state.customers.find(x => x.id === id);
      if (!c) break;
      const idx = currentPackIndex(c);
      const pack = idx >= 0 ? c.packs[idx] : null;
      state.modal = { type: 'editCustomer', id };
      state.modalForm = { name: c.name, phone: c.phone, joinDate: c.joinDate, registrationOnly: !pack, packType: pack ? pack.packType || 'custom' : 'custom', totalShakes: pack ? String(pack.totalShakes) : '', cost: pack ? String(pack.cost) : '', startDate: pack ? pack.startDate : c.joinDate };
      render();
      break;
    }
    case 'openPayment':
      state.modal = { type: 'payment', id };
      state.modalForm = { amount: '', date: todayStr(), note: '' };
      render();
      break;
    case 'openRenew':
      state.modal = { type: 'renew', id };
      state.modalForm = { packType: '26-day', totalShakes: String(packType('26-day').totalShakes), cost: '', startDate: todayStr(), initialPayment: '' };
      render();
      break;
    case 'openDelete':
      state.modal = { type: 'delete', id };
      render();
      break;
    case 'openBackup':
      state.modal = { type: 'backup' };
      render();
      break;
    case 'closeModal':
      state.modal = null;
      state.modalForm = null;
      render();
      break;
    case 'setQuickValue':
      setPath(state, target.dataset.path, target.dataset.value);
      render();
      break;
    /* ---- v10: auth, logins, reports ---- */
    case 'setLoginRole':
      syncAuthFromDom();
      state.authForm.role = target.dataset.value === 'owner' ? 'owner' : 'customer';
      state.authForm.mode = 'login';
      state.authForm.error = '';
      render();
      break;
    case 'togglePw':
      syncAuthFromDom();
      state.authForm.show = !state.authForm.show;
      render();
      break;
    case 'toggleSetup':
      syncAuthFromDom();
      state.authForm.mode = state.authForm.mode === 'setup' ? 'login' : 'setup';
      state.authForm.error = '';
      render();
      break;
    case 'toggleCustomerRegister':
      syncAuthFromDom();
      state.authForm.mode = state.authForm.mode === 'register' ? 'login' : 'register';
      state.authForm.error = '';
      if (!directoryLoaded) loadClubDirectory().catch(function () {});
      render();
      break;
    case 'retryClubDirectory':
      directoryLoaded = false;
      state.directoryError = false;
      loadClubDirectory().catch(function () {});
      render();
      break;
    case 'openLinkRegistration': {
      const registration = state.pendingRegistrations.find(function (entry) { return entry.id === id; });
      if (!registration) break;
      const linked = activeCustomers().find(function (customer) {
        return customer.login && customer.login.uid === registration.uid;
      });
      const matched = activeCustomers().find(function (customer) {
        return normalizedMobile(customer.phone) === normalizedMobile(registration.mobile);
      });
      state.modal = { type: 'linkRegistration', id: id };
      state.modalForm = { customerId: linked ? linked.id : (matched ? matched.id : '__new__'), busy: false, error: '' };
      render();
      break;
    }
    case 'approveRegistration': doLinkRegistration(); break;
    case 'doLogout': doLogout(); break;
    case 'openAccount':
      state.modal = { type: 'account' };
      state.modalForm = null;
      render();
      break;
    case 'openChangePw':
      state.modal = { type: 'changePw' };
      state.modalForm = { current: '', next: '', next2: '', busy: false, error: '', ok: false };
      render();
      break;
    case 'openAddOwner':
      state.modal = { type: 'addOwner' };
      state.modalForm = { email: '', username: '', password: randomPassword(), busy: false, error: '', done: false };
      render();
      break;
    case 'genPassword':
      state.modalForm.password = randomPassword();
      render();
      break;
    case 'openCustLogin': {
      const c = state.customers.find(x => x.id === id);
      if (!c) break;
      const reset = target.dataset.mode === 'reset' && c.login;
      state.modal = { type: 'custLogin', id, mode: reset ? 'reset' : 'create' };
      state.modalForm = { email: reset ? c.login.email : '', password: randomPassword(), busy: false, error: '', done: false };
      render();
      break;
    }
    case 'saveCustLogin': doSaveCustLogin(); break;
    case 'shareLogin': {
      const c = state.customers.find(x => x.id === id);
      if (c) window.open(waLink(c.phone, credentialMessage(c, state.modalForm.username, state.modalForm.password)), '_blank');
      break;
    }
    case 'openRemoveLogin':
      state.modal = { type: 'removeLogin', id };
      state.modalForm = { busy: false, error: '' };
      render();
      break;
    case 'confirmRemoveLogin': doRemoveLogin(id); break;
    case 'saveChangePw': doChangePassword(); break;
    case 'saveAddOwner': doAddOwner(); break;
    case 'toggleFollowAll':
      state.followAll = !state.followAll;
      render();
      break;
    case 'remind': doRemind(id, target.dataset.type); break;
    case 'setReportView':
      state.reportView = target.dataset.value;
      render();
      break;
    case 'navReportDay': {
      const nd = addDays(state.reportDay, Number(target.dataset.delta));
      state.reportDay = nd > todayStr() ? todayStr() : nd;
      render();
      break;
    }
    case 'navPortalMonth': {
      const next = addMonths(state.portalMonth || todayStr().slice(0, 7), Number(target.dataset.delta));
      state.portalMonth = next > todayStr().slice(0, 7) ? todayStr().slice(0, 7) : next;
      render();
      break;
    }
    case 'setCustPeriod':
      state.custPeriod = target.dataset.value;
      render();
      break;
    case 'saveAddCustomer': doAddCustomer(); break;
    case 'saveEditCustomer': doEditCustomer(); break;
    case 'savePayment': doSavePayment(); break;
    case 'saveQuickPayment': doSaveQuickPayment(); break;
    case 'saveRenew': doRenewPack(); break;
    case 'confirmDelete': doDeleteCustomer(id); break;
    case 'navDate':
      state.attendanceDate = addDays(state.attendanceDate, Number(target.dataset.delta));
      render();
      break;
    case 'navMonth':
      state.reportMonth = addMonths(state.reportMonth, Number(target.dataset.delta));
      render();
      break;
    case 'toggleVisit': doToggleVisit(id); break;
    case 'adjustAttendance': doAdjustAttendance(id, Number(target.dataset.delta)); break;
    case 'markRemovePayment':
      state.removePayment = { customerId: id, paymentId: target.dataset.pid };
      render();
      break;
    case 'cancelRemovePayment':
      state.removePayment = null;
      render();
      break;
    case 'deletePayment': doDeletePayment(id, target.dataset.pid); break;
    case 'downloadBackup': doDownloadBackup(); break;

    /* ---- Orders ---- */
    case 'setOrderFilter':
      state.orderFilter = target.dataset.value;
      render();
      break;
    case 'toggleExpandOrder':
      state.expandedOrderId = state.expandedOrderId === id ? null : id;
      state.removeOrderPayment = null;
      render();
      break;
    case 'openAddOrder':
      state.modal = { type: 'addOrder' };
      state.modalForm = { customerName: '', date: todayStr(), items: [{ name: '', price: '', quantity: '1' }], initialPayment: '' };
      render();
      break;
    case 'openEditOrder': {
      const o = state.orders.find(x => x.id === id);
      state.modal = { type: 'editOrder', id };
      state.modalForm = {
        customerName: o.customerName,
        date: o.date,
        items: (o.items || []).filter(i => !i.deleted).map(i => ({ id: i.id, name: i.name, price: String(i.price), quantity: String(i.quantity || 1) }))
      };
      render();
      break;
    }
    case 'addOrderItem':
      state.modalForm.items.push({ name: '', price: '', quantity: '1' });
      render();
      break;
    case 'removeOrderItem':
      if (state.modalForm.items.length > 1) state.modalForm.items.splice(Number(target.dataset.index), 1);
      render();
      break;
    case 'openOrderPayment':
      state.modal = { type: 'orderPayment', id };
      state.modalForm = { amount: '', date: todayStr(), note: '' };
      render();
      break;
    case 'openDeleteOrder':
      state.modal = { type: 'deleteOrder', id };
      render();
      break;
    case 'saveAddOrder': doAddOrder(); break;
    case 'saveEditOrder': doEditOrder(); break;
    case 'saveOrderPayment': doSaveOrderPayment(); break;
    case 'confirmDeleteOrder': doDeleteOrder(id); break;
    case 'markRemoveOrderPayment':
      state.removeOrderPayment = { orderId: id, paymentId: target.dataset.pid };
      render();
      break;
    case 'cancelRemoveOrderPayment':
      state.removeOrderPayment = null;
      render();
      break;
    case 'deleteOrderPayment': doDeleteOrderPayment(id, target.dataset.pid); break;
  }
}

function doAddCustomer() {
  const f = state.modalForm;
  if (!(f.name.trim() && f.totalShakes !== '' && Number(f.totalShakes) > 0 && f.cost !== '' && Number(f.cost) >= 0 &&
    f.remainingShakes !== '' && Number(f.remainingShakes) >= 0 && Number(f.remainingShakes) <= Number(f.totalShakes))) return;
  const joinDate = f.joinDate || todayStr();
  const type = packType(f.packType);
  const c = {
    id: uid(),
    name: f.name.trim(),
    phone: f.phone.trim(),
    joinDate,
    packs: [{
      id: uid(), packType: type.id, totalShakes: Number(f.totalShakes),
      usedOffset: Number(f.totalShakes) - Number(f.remainingShakes),
      cost: Number(f.cost) || 0, startDate: joinDate, expiryDate: packExpiryDate(type.id, joinDate)
    }],
    payments: [],
    visits: []
  };
  if (Number(f.initialPayment) > 0) {
    c.payments.push({ id: uid(), amount: Number(f.initialPayment), date: joinDate, note: 'Initial payment', ts: Date.now() });
  }
  state.customers.push(c);
  saveData();
  state.modal = null;
  state.modalForm = null;
  render();
}

function doEditCustomer() {
  const f = state.modalForm;
  if (!(f.name.trim() && (f.registrationOnly || (f.totalShakes !== '' && Number(f.totalShakes) > 0 && f.cost !== '' && Number(f.cost) >= 0)))) return;
  const id = state.modal.id;
  const c = state.customers.find(x => x.id === id);
  c.name = f.name.trim();
  c.phone = f.phone.trim();
  c.joinDate = f.joinDate || c.joinDate;
  const idx = currentPackIndex(c);
  if (idx < 0) {
    c.registrationOnly = true;
    saveData();
    state.modal = null;
    state.modalForm = null;
    render();
    return;
  }
  const pack = c.packs[idx];
  const type = packType(f.packType);
  pack.totalShakes = Number(f.totalShakes);
  pack.cost = Number(f.cost) || 0;
  pack.packType = type.id;
  pack.startDate = f.startDate || pack.startDate;
  pack.expiryDate = packExpiryDate(type.id, pack.startDate);
  saveData();
  state.modal = null;
  state.modalForm = null;
  render();
}

function doLinkRegistration() {
  const form = state.modalForm;
  const registration = state.pendingRegistrations.find(function (entry) { return state.modal && entry.id === state.modal.id; });
  if (!registration || !form || form.busy) return;
  const clubId = state.session.profile && state.session.profile.clubId;
  if (!clubId || registration.club_id !== clubId) {
    form.error = 'This registration does not belong to your club.';
    render();
    return;
  }
  let customer = form.customerId === '__new__'
    ? null
    : state.customers.find(function (entry) { return entry.id === form.customerId && !entry.deleted; });
  if (!customer) {
    customer = state.customers.find(function (entry) {
      return !entry.deleted && entry.login && entry.login.uid === registration.uid;
    }) || null;
  }
  if (form.customerId !== '__new__' && !customer) {
    form.error = 'Choose a valid customer record.';
    render();
    return;
  }
  if (customer && customer.login && customer.login.uid !== registration.uid) {
    form.error = 'That customer already has a different login. Remove or reset it before linking.';
    render();
    return;
  }
  const email = cleanEmail(registration.email);
  if (!validEmail(email)) {
    form.error = 'This registration has no valid email address. Ask the customer to register again with a valid email.';
    render();
    return;
  }
  if (!customer) {
    customer = migrateCustomer({
      id: uid(),
      name: registration.name,
      phone: registration.mobile,
      joinDate: todayStr(),
      registrationOnly: true,
      packs: [],
      payments: [],
      visits: [],
      createdAt: Date.now(),
      updatedAt: Date.now()
    });
  }
  const login = {
    username: email,
    email: email,
    uid: registration.uid,
    createdAt: localDateStr(Date.now())
  };
  form.busy = true;
  form.error = '';
  render();
  if (form.customerId === '__new__' && !state.customers.some(function (entry) { return entry.id === customer.id; })) {
    if (form.customerId === '__new__') state.customers.push(customer);
  }
  customer.login = login;
  saveData().then(function (synced) {
    if (!synced) throw new Error('The customer link is saved on this device but could not sync. Reconnect and try again.');
    return supabaseClient.from('customer_registrations').update({
      status: 'linked',
      linked_customer_id: customer.id,
      updated_at: Date.now()
    }).eq('club_id', clubId).eq('user_uid', registration.id).eq('status', 'pending')
      .select('user_uid').single();
  }).then(function (result) {
    if (result.error) throw result.error;
    state.modal = null;
    state.modalForm = null;
    render();
  }).catch(function (err) {
    form.busy = false;
    form.error = err && err.message ? err.message : authErrorText(err);
    render();
  });
}

function doSavePayment() {
  const f = state.modalForm;
  if (!(Number(f.amount) > 0)) return;
  const id = state.modal.id;
  const c = state.customers.find(x => x.id === id);
  c.payments = c.payments || [];
  c.payments.push({ id: uid(), amount: Number(f.amount), date: f.date || todayStr(), note: (f.note || '').trim(), ts: Date.now() });
  saveData();
  state.modal = null;
  state.modalForm = null;
  render();
}

function doSaveQuickPayment() {

  customer.payments = customer.payments || [];
  customer.payments.push({
    id: uid(), amount: Number(f.amount), date: f.date || todayStr(),

  });

function doRenewPack() {
  const f = state.modalForm;
  if (!(f.totalShakes !== '' && Number(f.totalShakes) > 0 && f.cost !== '' && Number(f.cost) >= 0)) return;
  const id = state.modal.id;
  const c = state.customers.find(x => x.id === id);
  delete c.registrationOnly;
  const startDate = f.startDate || todayStr();
  const type = packType(f.packType);
  c.packs = c.packs || [];
  c.packs.push({
    id: uid(), packType: type.id, totalShakes: Number(f.totalShakes), usedOffset: 0,
    cost: Number(f.cost) || 0, startDate, expiryDate: packExpiryDate(type.id, startDate)
  });
  if (Number(f.initialPayment) > 0) {
    c.payments = c.payments || [];
    c.payments.push({ id: uid(), amount: Number(f.initialPayment), date: startDate, note: 'New pack payment', ts: Date.now() });
  }
  saveData();
  state.modal = null;
  state.modalForm = null;
  render();
}

/* ---- v10: customer logins ---- */
function credentialMessage(c, email, password) {
  return 'Hi ' + c.name + ', you can now check your shakes left and balance in the ' + currentClubName() + ' app.\n\n' +
    'Open: ' + appUrl() + '\nChoose "Customer", then log in:\nEmail: ' + email + '\nPassword: ' + password + '\n\nPlease keep this private.';
}
function createCustomerAuth(email, password) {
  const clubId = state.session.profile && state.session.profile.clubId;
  const customer = state.customers.find(function (entry) { return state.modal && entry.id === state.modal.id; });
  if (!customer) return Promise.reject(new Error('Customer record could not be found.'));
  return manageAccount('customer-create', {
    clubId: clubId,
    customerId: customer.id,
    customerName: customer.name,
    mobile: customer.phone,
    email: email,
    password: password
  });
}
function doSaveCustLogin() {
  const f = state.modalForm;
  const m = state.modal;
  const c = state.customers.find(x => x.id === m.id);
  if (!c || f.busy) return;
  const reset = m.mode === 'reset' && c.login;
  const email = cleanEmail(f.email);
  if (!reset && !validEmail(email)) { f.error = 'Enter a valid email address for this customer.'; render(); return; }
  if (String(f.password).length < 6) { f.error = 'Password needs at least 6 characters.'; render(); return; }
  f.busy = true;
  f.error = '';
  render();
  const oldUid = reset ? c.login.uid : null;
  const clubId = state.session.profile && state.session.profile.clubId;
  if (!clubId) { f.busy = false; f.error = 'Club details are unavailable. Sign in again.'; render(); return; }
  const operation = reset
    ? manageAccount('customer-reset', { clubId: clubId, customerId: c.id, customerUid: oldUid, password: f.password })
    : createCustomerAuth(email, f.password);
  operation.then(function (res) {
      if (!reset) {
        c.login = { username: email, email: res.email, uid: res.uid, createdAt: todayStr() };
      }
      return saveData();
    }).then(function () {
      f.done = true;
      f.busy = false;
      render();
  }).catch(function (err) {
    f.busy = false;
    f.error = authErrorText(err);
    render();
  });
}
function doRemoveLogin(id) {
  const c = state.customers.find(x => x.id === id);
  const f = state.modalForm;
  if (!c || !c.login || f.busy) return;
  const uid = c.login.uid;
  f.busy = true;
  f.error = '';
  const clubId = state.session.profile && state.session.profile.clubId;
  manageAccount('customer-remove', { clubId: clubId, customerId: c.id, customerUid: uid }).then(function () {
    delete c.login;
    delete portalSig[uid];
    saveData();
    state.modal = null;
    state.modalForm = null;
    render();
  }).catch(function (err) {
    f.busy = false;
    f.error = authErrorText(err);
    render();
  });
}
function doChangePassword() {
  const f = state.modalForm;
  if (!supabaseClient || f.busy) return;
  f.busy = true; f.error = ''; f.ok = false;
  render();
  supabaseClient.auth.updateUser({ password: f.next })
    .then(function (result) {
      if (result.error) throw result.error;
    })
    .then(function () { f.busy = false; f.ok = true; f.current = ''; f.next = ''; f.next2 = ''; render(); })
    .catch(function (err) { f.busy = false; f.error = authErrorText(err); render(); });
}
function doAddOwner() {
  const f = state.modalForm;
  if (f.busy) return;
  const username = normalizedMobile(f.username);
  const email = cleanEmail(f.email);
  if (!/^\d{8,15}$/.test(username)) { f.error = 'Enter a valid mobile number with country code (8–15 digits).'; render(); return; }
  if (!validEmail(email)) { f.error = 'Enter a valid email address.'; render(); return; }
  if (String(f.password || '').length < 6) { f.error = 'Password needs at least 6 characters.'; render(); return; }
  f.busy = true; f.error = '';
  render();
  manageAccount('owner-add', {
    mobile: username, email: email, password: f.password,
    clubId: state.session.profile.clubId, ownerName: f.ownerName || username
  }).then(function () {
    f.username = username; f.email = email; f.done = true; f.busy = false; render();
  }).catch(function (err) {
    f.busy = false; f.error = authErrorText(err); render();
  });
}

function doDeleteCustomer(id) {
  const gone = state.customers.find(c => c.id === id);
  if (gone && gone.login && gone.login.uid) delete portalSig[gone.login.uid];
  if (gone) gone.deleted = true;
  if (state.expandedId === id) state.expandedId = null;
  saveData();
  state.modal = null;
  render();
}

function doToggleVisit(id) {
  doAdjustAttendance(id, 1);
}

function doAdjustAttendance(id, delta) {
  const c = state.customers.find(x => x.id === id);
  if (!c || c.deleted || !Number.isInteger(delta) || Math.abs(delta) !== 1) return;
  c.visits = c.visits || [];
  c.attendanceCounts = c.attendanceCounts || {};
  const date = state.attendanceDate;
  const current = attendanceCount(c, date);
  if (delta > 0 && (packStatus(c, currentPackIndex(c)) !== 'active' || packShakesRemaining(c, currentPackIndex(c)) <= 0) &&
    !confirm('This pack is finished or expired. Record the shake anyway?')) return;
  const next = Math.max(0, current + delta);
  c.attendanceRecords = c.attendanceRecords || [];
  let attendance = c.attendanceRecords.find(a => a.date === date);
  if (!attendance) {
    attendance = { id: uid(), date, shakes: 0, createdAt: Date.now(), updatedAt: Date.now(), deleted: false };
    c.attendanceRecords.push(attendance);
  }
  attendance.shakes = next;
  attendance.deleted = next === 0;
  attendance.updatedAt = Date.now();
  if (next > 0 && !c.visits.includes(date)) c.visits.push(date);
  if (next === 0) c.visits = c.visits.filter(d => d !== date);
  if (next > 0) c.attendanceCounts[date] = next;
  else delete c.attendanceCounts[date];
  saveData();
  render();
}

function doDeletePayment(cid, pid) {
  const c = state.customers.find(x => x.id === cid);
  const payment = (c.payments || []).find(p => p.id === pid);
  if (payment) payment.deleted = true;
  state.removePayment = null;
  saveData();
  render();
}

/* ---- Orders ---- */
function doAddOrder() {
  const f = state.modalForm;
  const items = (f.items || [])
    .filter(i => i.name.trim() && Number(i.price) > 0)
    .map(i => ({ id: uid(), name: i.name.trim(), price: Number(i.price), quantity: Math.max(1, Math.floor(Number(i.quantity) || 1)) }));
  if (!(f.customerName.trim() && items.length > 0)) return;
  const date = f.date || todayStr();
  const o = {
    id: uid(),
    customerName: f.customerName.trim(),
    date,
    items,
    payments: []
  };
  if (Number(f.initialPayment) > 0) {
    o.payments.push({ id: uid(), amount: Number(f.initialPayment), date, note: 'Initial payment', ts: Date.now() });
  }
  state.orders = state.orders || [];
  state.orders.push(o);
  saveData();
  state.modal = null;
  state.modalForm = null;
  render();
}

function doEditOrder() {
  const f = state.modalForm;
  const items = (f.items || [])
    .filter(i => i.name.trim() && Number(i.price) > 0)
    .map(i => ({ id: i.id || uid(), name: i.name.trim(), price: Number(i.price), quantity: Math.max(1, Math.floor(Number(i.quantity) || 1)) }));
  if (!(f.customerName.trim() && items.length > 0)) return;
  const id = state.modal.id;
  const o = state.orders.find(x => x.id === id);
  o.customerName = f.customerName.trim();
  o.date = f.date || o.date;
  const previousItems = o.items || [];
  o.items = previousItems.map(function (oldItem) {
    const updated = items.find(item => item.id === oldItem.id);
    return updated ? Object.assign({}, oldItem, updated, { deleted: false }) :
      Object.assign({}, oldItem, { deleted: true, updatedAt: Date.now() });
  }).concat(items.filter(item => !previousItems.some(oldItem => oldItem.id === item.id)));
  saveData();
  state.modal = null;
  state.modalForm = null;
  render();
}

function doSaveOrderPayment() {
  const f = state.modalForm;
  if (!(Number(f.amount) > 0)) return;
  const id = state.modal.id;
  const o = state.orders.find(x => x.id === id);
  o.payments = o.payments || [];
  o.payments.push({ id: uid(), amount: Number(f.amount), date: f.date || todayStr(), note: (f.note || '').trim(), ts: Date.now() });
  saveData();
  state.modal = null;
  state.modalForm = null;
  render();
}

function doDeleteOrder(id) {
  const order = (state.orders || []).find(o => o.id === id);
  if (order) order.deleted = true;
  if (state.expandedOrderId === id) state.expandedOrderId = null;
  saveData();
  state.modal = null;
  render();
}

function doDeleteOrderPayment(oid, pid) {
  const o = state.orders.find(x => x.id === oid);
  const payment = (o.payments || []).find(p => p.id === pid);
  if (payment) payment.deleted = true;
  state.removeOrderPayment = null;
  saveData();
  render();
}

function doDownloadBackup() {
  const data = JSON.stringify({ customers: state.customers, orders: state.orders, exportedAt: new Date().toISOString() }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'club-ledger-backup-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function isSupabaseUid(value) {
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(value || ''));
}

function migrateBackupCustomer(record) {
  const customer = Object.assign({}, record);
  if (customer.login && customer.login.uid && !isSupabaseUid(customer.login.uid)) {
    delete customer.login;
  }
  return migrateCustomer(customer);
}

function handleRestoreFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (e) {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!Array.isArray(parsed.customers)) throw new Error('invalid');
      if (confirm('Replace all current data with this backup? This cannot be undone.')) {
        let legacyLoginsRemoved = 0;
        state.customers = parsed.customers.map(function (record) {
          if (record.login && record.login.uid && !isSupabaseUid(record.login.uid)) {
            legacyLoginsRemoved++;
          }
          return migrateBackupCustomer(record);
        });
        state.orders = Array.isArray(parsed.orders) ? parsed.orders.map(migrateOrder) : [];
        saveData();
        if (legacyLoginsRemoved) {
          state.dataNotice = legacyLoginsRemoved + ' old account link(s) were removed. Customers must register again or receive a new login.';
        }
        state.modal = null;
        render();
      }
    } catch (err) {
      alert('Invalid backup file.');
    }
  };
  reader.readAsText(file);
}

/* ---------- Event delegation ---------- */
document.body.addEventListener('click', function (e) {
  if (e.target.classList && e.target.classList.contains('modal-overlay')) {
    if (state.modalForm && state.modalForm.done) return; // credentials are on screen: only close with the buttons
    state.modal = null;
    state.modalForm = null;
    render();
    return;
  }
  const target = e.target.closest('[data-action]');
  if (!target) return;
  handleAction(target.dataset.action, target);
});

document.body.addEventListener('input', function (e) {
  const target = e.target;
  if (target.dataset && target.dataset.bind) {
    setPath(state, target.dataset.bind, target.value);
    render();
  }
});

document.body.addEventListener('change', function (e) {
  if (e.target.id === 'restore-file') {
    handleRestoreFile(e.target.files[0]);
    e.target.value = '';
    return;
  }
  if (e.target.matches('[data-pack-type-select]') && state.modalForm) {
    const selected = packType(e.target.value);
    state.modalForm.packType = selected.id;
    state.modalForm.totalShakes = String(selected.totalShakes);
    state.modalForm.cost = String(selected.price);
    if (Object.prototype.hasOwnProperty.call(state.modalForm, 'remainingShakes')) {
      state.modalForm.remainingShakes = String(selected.totalShakes);
    }
    render();
    return;
  }
  if (e.target.dataset && e.target.dataset.bind) {
    setPath(state, e.target.dataset.bind, e.target.value);
    render();
  }
});

/* ---------- Event delegation (v10: form submit) ---------- */
document.body.addEventListener('submit', function (e) {
  const form = e.target.closest ? e.target.closest('[data-form]') : null;
  if (!form) return;
  e.preventDefault();
  if (form.dataset.form === 'adminLogin') doAdminLogin();
  else if (form.dataset.form === 'adminOwnerEdit') saveAdminOwnerEdit();
  else if (form.dataset.form === 'ownerSetup') doOwnerSetup();
  else if (form.dataset.form === 'customerRegister') doCustomerRegister();
  else doLogin();
});

/* ---------- Init ---------- */
loadData();
document.documentElement.dataset.theme = state.theme;
try {
  if (CONFIG.supabase.url && CONFIG.supabase.anonKey) {
    supabaseClient = createClient(CONFIG.supabase.url, CONFIG.supabase.anonKey);
    supabaseReady = true;
  } else {
    state.syncError = 'Supabase is not configured. Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in your environment.';
  }
} catch (e) {
  state.syncError = 'Supabase client could not be initialized. Check the project URL and anon key.';
}
if (supabaseReady) loadClubDirectory().catch(function () {});
render();
startAuth();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  });
}
window.addEventListener('online', function () {
  if (state.session.role === 'owner') {
    startOwnerSync();
  } else if (state.session.role === 'customer') {
    startPortalSync(state.session.uid);
  }
});
window.addEventListener('offline', function () {
  syncStatus = 'offline';
  render();
});
</script>
</body>
</html>
